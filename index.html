<!DOCTYPE html>
<html lang="en">
<head>

<title>Three Words</title>
<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Three Words">

<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
    --bg: #EEF0FF;
    --surface: #FFFFFF;
    --ink: #23224A;
    --ink-soft: #5A5980;
    --line: #D9DBF5;
    --accent: #5B4BDB;
    --accent-ink: #FFFFFF;
    --c1: #FFB5C2;
    --c2: #FFE08A;
    --c3: #9FE3C8;
    --card-ink: #23224A;
    --card-soft: #4A4870;
    --card-btn: rgba(255,255,255,.7);
    --bubble: rgba(255,255,255,.75);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #171633;
      --surface: #23224A;
      --ink: #F3F1FF;
      --ink-soft: #B5B3DB;
      --line: #35336B;
      --accent: #8F82FF;
      --accent-ink: #14132E;
      --c1: #6B2F49;
      --c2: #66531B;
      --c3: #1F5A48;
      --card-ink: #F7F5FF;
      --card-soft: #D8D5F5;
      --card-btn: rgba(255,255,255,.14);
      --bubble: rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #171633;
    --surface: #23224A;
    --ink: #F3F1FF;
    --ink-soft: #B5B3DB;
    --line: #35336B;
    --accent: #8F82FF;
    --accent-ink: #14132E;
    --c1: #6B2F49;
    --c2: #66531B;
    --c3: #1F5A48;
    --card-ink: #F7F5FF;
    --card-soft: #D8D5F5;
    --card-btn: rgba(255,255,255,.14);
    --bubble: rgba(0,0,0,.25);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    background: var(--bg); z-index: 10;
  }
  .app { max-width: 460px; margin: 0 auto; padding: 20px 16px 112px; }
  h1 {
    font-family: "Fredoka", "Nunito", system-ui, sans-serif;
    font-weight: 600; font-size: 34px; line-height: 1.1; margin: 8px 0 4px; letter-spacing: -0.01em;
  }
  .date { color: var(--ink-soft); font-size: 16px; margin: 0 0 20px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .toast { background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 15px; border-radius: 14px; padding: 10px 14px; margin: 0 0 14px; }
  .cards { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .card { border-radius: 28px; padding: 18px 18px 16px; color: var(--card-ink); }
  .card:nth-child(3n+1) { background: var(--c1); }
  .card:nth-child(3n+2) { background: var(--c2); }
  .card:nth-child(3n+3) { background: var(--c3); }
  .word-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .word {
    font-family: "Fredoka", "Nunito", system-ui, sans-serif;
    font-weight: 600; font-size: 44px; line-height: 1.05; letter-spacing: -0.01em; white-space: nowrap;
  }
  .meta { font-size: 14px; font-weight: 700; color: var(--card-soft); margin-top: 2px; }
  .round {
    flex: none; width: 56px; height: 56px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
    transition: transform .12s ease;
  }
  .round:active { transform: scale(.92); }
  .round svg { width: 26px; height: 26px; }
  .round.small { width: 40px; height: 40px; background: var(--card-btn); color: var(--card-ink); }
  .round.small svg { width: 20px; height: 20px; }
  .round.accent { background: var(--accent); color: var(--accent-ink); }
  .round.sec { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
  .round.speaking { outline: 3px solid var(--card-ink); outline-offset: 2px; }
  .tr { margin: 12px 0 0; display: grid; gap: 4px; }
  .tr div { font-size: 22px; font-weight: 700; line-height: 1.3; display: flex; gap: 10px; align-items: baseline; }
  .tr .lang { font-size: 13px; font-weight: 600; color: var(--card-soft); min-width: 58px; }
  .tr .he { font-family: "Heebo", "Nunito", "Segoe UI", Arial, sans-serif; direction: rtl; }
  .ex-btn {
    margin-top: 14px; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 16px;
    background: var(--card-btn); color: var(--card-ink); padding: 10px 18px; border-radius: 999px; min-height: 44px;
  }
  .ex-btn:active { transform: scale(.97); }
  .bubble {
    margin-top: 14px; background: var(--bubble); border-radius: 18px; padding: 12px 12px 12px 16px;
    display: flex; gap: 10px; align-items: center; justify-content: space-between;
  }
  .bubble p { margin: 0; font-size: 19px; line-height: 1.4; font-weight: 600; }
  div.bubble, div.lsent { display: block; }
  .s-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .tr-btn {
    border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 14px; margin-top: 8px;
    background: var(--card-btn); color: var(--card-ink); padding: 6px 14px; border-radius: 999px; min-height: 36px;
  }
  .bubble .he-sent, .lsent .he-sent {
    margin: 8px 0 0; font-family: "Heebo", "Nunito", "Segoe UI", Arial, sans-serif; font-size: 19px; line-height: 1.5; font-weight: 600;
  }
  .bubble.pop { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .bubble.pop { animation: none; } .round, .ex-btn, .chev { transition: none; } }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }
  .bar-inner { max-width: 460px; margin: 0 auto; display: flex; gap: 10px; }
  .primary {
    flex: 1; border: 0; cursor: pointer; font: inherit; font-family: "Fredoka", "Nunito", sans-serif;
    font-weight: 600; font-size: 22px; padding: 16px; border-radius: 22px;
    background: var(--accent); color: var(--accent-ink); min-height: 56px;
  }
  .primary:active { transform: scale(.98); }
  .back {
    border: 0; background: none; color: var(--accent); font: inherit; font-weight: 800; font-size: 17px;
    cursor: pointer; padding: 8px 0; min-height: 44px;
  }

  /* Logbook */
  .day-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
    padding: 0 12px; margin: 12px 0 0;
  }
  .day-card[open] { padding-bottom: 8px; }
  .day-wrap { display: flex; gap: 8px; align-items: flex-start; margin-top: 12px; }
  .day-wrap .day-card { margin: 0; flex: 1; min-width: 0; }
  .sum-right { display: flex; align-items: center; gap: 10px; flex: none; }
  .day-card summary .del { min-width: 44px; height: 44px; border-radius: 14px; }
  .del {
    flex: none; min-width: 60px; height: 60px; padding: 0 12px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-soft); cursor: pointer; display: grid; place-items: center;
    font: inherit; font-weight: 800; font-size: 14px;
  }
  .del svg { width: 22px; height: 22px; }
  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .del-all {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 800; font-size: 14px;
    border-radius: 999px; padding: 8px 14px; min-height: 40px; cursor: pointer;
  }
  .del.pending, .del-all.pending { background: #C62F4B; color: #FFFFFF; border-color: #C62F4B; }
  .day-card summary {
    list-style: none; cursor: pointer; min-height: 60px; display: flex; align-items: center; justify-content: space-between;
    font-family: "Fredoka", "Nunito", sans-serif; font-size: 20px; font-weight: 600;
  }
  .day-card summary::-webkit-details-marker { display: none; }
  .day-card summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 12px; }
  .sum-main { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .sum-time { font-size: 17px; font-weight: 600; color: var(--ink-soft); }
  .chev { width: 24px; height: 24px; color: var(--ink-soft); transition: transform .15s ease; flex: none; }
  .day-card[open] .chev { transform: rotate(90deg); }
  .lrow { padding: 12px 10px 12px 12px; margin-bottom: 10px; border-radius: 22px; color: var(--card-ink); }
  .lrow.c1 { background: var(--c1); }
  .lrow.c2 { background: var(--c2); }
  .lrow.c3 { background: var(--c3); }
  .lrow .word { font-size: 28px; }
  .word-row > div:first-child { flex: 1; min-width: 0; }
  .word.wrap { white-space: normal; }
  .reset-btn {
    margin-top: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-weight: 800;
    font-size: 15px; border-radius: 999px; padding: 9px 16px; min-height: 40px; cursor: pointer;
  }
  .reset-btn:disabled { opacity: .45; cursor: default; }
  .reset-btn.pending { background: #C62F4B; color: #FFFFFF; border-color: #C62F4B; }
  .lrow .tr { margin-top: 4px; }
  .lrow .tr div { font-size: 18px; }
  .lrow .ex-btn { margin-top: 10px; min-height: 40px; padding: 8px 16px; }
  .lsent { margin-top: 10px; background: var(--bubble); border-radius: 16px; padding: 10px 10px 10px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .lsent p { margin: 0; font-size: 17px; line-height: 1.4; font-weight: 600; }
  .log-scroll {
    max-height: calc(100vh - 190px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    max-height: calc(100dvh - 190px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    padding: 0 6px 16px 0; margin-right: -6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .log-scroll:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 12px; }
  .empty { text-align: center; color: var(--ink-soft); padding: 40px 16px; font-size: 18px; }

  /* Settings */
  .set-card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 18px 18px 6px; margin-top: 16px; }
  .set-card h2 { font-family: "Fredoka", "Nunito", sans-serif; font-size: 22px; font-weight: 600; margin: 0 0 16px; }
  fieldset { border: 0; margin: 0 0 20px; padding: 0; min-width: 0; }
  legend { font-weight: 800; font-size: 16px; padding: 0; margin-bottom: 10px; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { position: relative; }
  .choice input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .choice span {
    display: block; box-sizing: border-box; min-height: 44px; padding: 10px 18px; border-radius: 999px;
    background: var(--bg); border: 2px solid var(--line); font-weight: 800; font-size: 16px; color: var(--ink);
  }
  .choice input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .choice input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 2px; }
  .hint { color: var(--ink-soft); font-size: 15px; line-height: 1.4; margin: 10px 0 0; }
  .notice { font-size: 13px; color: var(--ink-soft); margin: 14px 0 0; line-height: 1.4; }

  details.tools { margin-top: 28px; color: var(--ink-soft); font-size: 14px; }
  details.tools summary { cursor: pointer; padding: 8px 0; }
  .tools button {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 6px 8px 0 0; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  fieldset:disabled { opacity: .45; }
  .primary.alt { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
  .card.test { background: var(--c2); }
  .opts { display: grid; gap: 10px; margin-top: 16px; }
  .opt {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px solid transparent; cursor: pointer;
    background: var(--card-btn); color: var(--card-ink); font-family: "Heebo", "Nunito", "Segoe UI", Arial, sans-serif;
    font-weight: 800; font-size: 20px; line-height: 1.3; border-radius: 18px; padding: 12px 16px; min-height: 56px; text-align: right;
  }
  .opt:active:not(:disabled) { transform: scale(.98); }
  .opt:disabled { cursor: default; }
  .opt:disabled:not(.ok):not(.bad) { opacity: .6; }
  .opt.ok { background: #1E8449; color: #FFFFFF; border-color: #14663A; }
  .opt.bad { background: #C62F4B; color: #FFFFFF; border-color: #9E2339; }
  .opt .mark { font-size: 22px; font-weight: 900; min-width: 22px; }
  .verdict { min-height: 24px; margin: 12px 0 0; font-weight: 800; font-size: 17px; }
  mark { background: transparent; color: inherit; font-weight: 900; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
</style>
</head>

const POS_NAME = {n:'noun', v:'verb', adj:'adjective', adv:'adverb', conj:'conjunction', term:'term'};
const LV = {A1:0, A2:1, B1:2, B2:3, C1:4};

/* ---------- Storage (falls back to memory if the browser blocks it) ---------- */
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
function loadLog(){
  let log = [];
  try { log = JSON.parse(store.get('dw_log') || '[]'); } catch(e){ log = []; }
  log.forEach(e => { if (!e.id) e.id = 'd' + e.date; });
  return log;
}
function saveLog(l){ store.set('dw_log', JSON.stringify(l)); }
function getOffset(){ return parseInt(store.get('dw_offset') || '0', 10) || 0; }

/* ---------- Settings ---------- */
const DEFAULTS = {freq:'day', pos:'mix', level:'A2', ctx:'day', repeat:'new'};
function getSettings(){
  let s = {};
  try { s = JSON.parse(store.get('dw_settings') || '{}'); } catch(e){ s = {}; }
  return Object.assign({}, DEFAULTS, s);
}
function saveSettings(s){ store.set('dw_settings', JSON.stringify(s)); }

/* ---------- Dates ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function nowShifted(){ const d = new Date(); d.setDate(d.getDate() + getOffset()); return d; }
function todayKey(){ return dateKey(nowShifted()); }
function prettyDate(key, withWeekday){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-US',
    withWeekday ? {weekday:'long', month:'long', day:'numeric'} : {weekday:'short', month:'short', day:'numeric', year:'numeric'});
}
function prettyTime(ts){ return new Date(ts).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}); }

/* ---------- Word choice ---------- */
/* Closest match to the settings; nothing repeats; if the sample list runs short, nearby levels or contexts fill in. */
function pickWords(used, s){
  if (s.level === 'mix' && s.ctx !== 'mitam') {          // mixed levels: each word gets its own random level
    const levels = s.ctx === 'lit' ? ['B1', 'B2'] : ['A1', 'A2', 'B1', 'B2'];
    const order = s.pos === 'mix' ? shuffle(['n', 'v', 'adj']) : [s.pos, s.pos, s.pos];
    const taken = new Set(used), picks = [];
    for (let k = 0; k < 3; k++) {
      const L = levels[Math.floor(Math.random() * levels.length)];
      const one = pickWordsCore(taken, Object.assign({}, s, {level:L, pos:order[k]}))[0];
      if (one) { picks.push(one); taken.add(one.i); }
    }
    return picks;
  }
  return pickWordsCore(used, s);
}
function pickWordsCore(used, s){
  const cand = [];
  WORDS.forEach((x, i) => {
    if (used.has(i)) return;
    const lv = (s.ctx === 'mitam' && x.c === 'mitam') ? 0 : Math.abs(LV[x.l] - LV[s.level]) * 2;   // Level does not apply to Mitam
    const d = (s.pos !== 'mix' && x.p !== s.pos ? 1 : 0) + lv + (x.c !== s.ctx ? 8 : 0);
    cand.push({i, d, p:x.p, seen:x.seen || 0, r:Math.random()});
  });
  cand.sort((a,b) => a.d - b.d || ((b.seen >= 2) - (a.seen >= 2)) || a.r - b.r);   // words seen in 2+ exams come first
  const picks = [];
  if (s.pos === 'mix') {                      // aim for one noun, one verb, one adjective
    ['n','v','adj'].sort(() => Math.random() - 0.5).forEach(p => {
      const c = cand.find(c => c.p === p && c.d <= 2);
      if (c) picks.push(c);
    });
  }
  for (const c of cand) { if (picks.length >= 3) break; if (!picks.includes(c)) picks.push(c); }
  return picks.slice(0,3).sort(() => Math.random() - 0.5);
}

function generateEntry(){
  const log = loadLog(), s = getSettings();
  let used = new Set();
  if (s.repeat !== 'allow') {                               // Only new words: skip Logbook words since the last start-over
    const since = store.get('dw_reset') || '';
    used = new Set(log.filter(e => !since || (e.ts || e.date) > since).flatMap(e => e.words.map(x => x.i)));
  }
  if (WORDS.length - used.size < 3) used = new Set();      // all words used: start over
  const picks = pickWords(used, s);
  const now = nowShifted();
  const entry = {
    id: 'e' + Date.now() + Math.random().toString(36).slice(2,6),
    date: dateKey(now), ts: now.toISOString(),
    timed: s.freq === 'run',
    relaxed: picks.some(c => c.d > 0),
    words: picks.map(c => ({i:c.i, ex:false}))
  };
  log.push(entry); saveLog(log);
  return entry;
}

/* One "app run" = one call to startSession().
   Once a day: reuse today's latest entry, or create it. Every run: always create a new entry. */
let currentId = null;
let flash = '';
function startSession(){
  const s = getSettings();
  let entry = null;
  if (s.freq === 'day') {
    const log = loadLog(), key = todayKey();
    for (let k = log.length - 1; k >= 0; k--) if (log[k].date === key) { entry = log[k]; break; }
  }
  const created = !entry;
  if (!entry) entry = generateEntry();
  currentId = entry.id;
  return created;
}
function currentEntry(){
  let e = loadLog().find(x => x.id === currentId);
  if (!e) { startSession(); e = loadLog().find(x => x.id === currentId); }
  return e;
}

/* ---------- Audio (US English) ---------- */
let voices = [];
function loadVoices(){ if ('speechSynthesis' in window) voices = speechSynthesis.getVoices(); }
loadVoices();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoices;
function pickVoice(){
  const us = voices.filter(v => /en[-_]US/i.test(v.lang));
  const pref = ['Samantha','Google US English','Aria','Jenny','Zira','Allison','Ava'];
  for (const p of pref){ const v = us.find(v => v.name.includes(p)); if (v) return v; }
  return us[0] || null;
}
function speak(text, btn){
  /* On the phone the native text-to-speech plugin is used; in a browser it falls back to the browser voice. */
  const tts = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.TextToSpeech;
  if (tts) {
    if (btn) btn.classList.add('speaking');
    Promise.resolve(tts.stop()).catch(() => {})
      .then(() => tts.speak({text:text, lang:'en-US', rate:0.85, pitch:1.0, volume:1.0, category:'playback'}))
      .catch(() => {})
      .then(() => { if (btn) btn.classList.remove('speaking'); });
    return;
  }
  if (!('speechSynthesis' in window)) { alert('Audio is not supported here.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85;
  const v = pickVoice(); if (v) u.voice = v;
  if (btn){ btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); }
  speechSynthesis.speak(u);
}

/* ---------- Rendering ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const speakerSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const gearSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';

const refreshSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>';

function translations(x){
  return '<div class="tr">' +
    '<div><span class="lang">עברית</span><span class="he" lang="he" dir="rtl">' + esc(x.he) + '</span></div>' +
    '<div><span class="lang">Русский</span><span lang="ru">' + esc(x.ru) + '</span></div></div>';
}
function wordHead(x, btnClass){
  return '<div class="word-row"><div><div class="word" lang="en">' + esc(x.w) + '</div>' +
    '<div class="meta">' + POS_NAME[x.p] + ', ' + (x.c === 'mitam' ? 'Mitam' + (x.seen >= 2 ? ', in ' + x.seen + ' exams' : '') : x.l) + '</div></div>' +
    '<button class="round ' + btnClass + '" data-act="audio" data-text="' + esc(x.w) + '" aria-label="Hear ' + esc(x.w) + '">' + speakerSvg + '</button></div>';
}

function sentenceBlock(x, cls, id){
  return '<div class="' + cls + '"' + (id ? ' id="' + id + '"' : '') + '><div class="s-row"><p>' + esc(x.s) + '</p>' +
    '<button class="round small" data-act="audio" data-text="' + esc(x.s) + '" aria-label="Hear the sentence">' + speakerSvg + '</button></div>' +
    '<button class="tr-btn" data-act="translate" aria-expanded="false">Translate</button>' +
    '<p class="he-sent" lang="he" dir="rtl" hidden>' + esc(x.hs) + '</p></div>';
}

function renderToday(){
  const entry = currentEntry();
  const cards = entry.words.map((p, idx) => {
    const x = WORDS[p.i];
    const sentence = p.ex
      ? sentenceBlock(x, 'bubble', 'b' + idx)
      : '<button class="ex-btn" data-act="example" data-idx="' + idx + '">Example</button>';
    return '<section class="card">' + wordHead(x, 'accent') + translations(x) + sentence + '</section>';
  }).join('');
  document.getElementById('app').innerHTML =
    '<div class="head"><div><h1>Today’s words</h1><p class="date">' + prettyDate(entry.date, true) + '</p></div>' +
    '<button class="round sec" data-act="reopen" aria-label="Reload the app">' + refreshSvg + '</button></div>' +
    (flash ? '<p class="toast" id="toast" role="status">' + flash + '</p>' : '') +
    '<div class="cards">' + cards + '</div>' +
    (entry.relaxed && PROTOTYPE_TOOLS ? '<p class="notice">Prototype note: the sample list has too few words for these exact settings, so some words come from a nearby level or context. The real list will be larger.</p>' : '') +
    (PROTOTYPE_TOOLS ? '<details class="tools"><summary>Prototype tools</summary>' +
    '<p class="notice">For testing only. These will not exist in the real app.</p>' +
    
    '<button data-act="nextday">Pretend it’s the next day</button>' +
    '<button data-act="reset">Erase all history</button></details>' : '');
  document.getElementById('barInner').innerHTML =
    '<button class="primary" data-act="logbook">Logbook</button>' +
    '<button class="primary alt" data-act="test">Test</button>' +
    '<button class="round sec" data-act="settings" aria-label="Settings">' + gearSvg + '</button>';
}

const openDays = new Set();
let pending = null;   // which delete button is waiting for a second tap
const trashSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
function renderLogbook(){
  const log = loadLog().map((e,k) => ({e,k}))
    .sort((a,b) => b.e.date.localeCompare(a.e.date) || (b.e.ts || '').localeCompare(a.e.ts || '') || b.k - a.k)
    .map(o => o.e);
  const days = log.map(e => {
    const items = e.words.map((p, idx) => {
      const x = WORDS[p.i];
      return '<div class="lrow c' + (idx % 3 + 1) + '">' + wordHead(x, 'small accent') + translations(x) + (p.ex
        ? sentenceBlock(x, 'lsent', '')
        : '<button class="ex-btn" data-act="logexample" data-id="' + esc(e.id) + '" data-idx="' + idx + '">Example</button>') + '</div>';
    }).join('');
    return '<div class="day-wrap"><details class="day-card" data-id="' + esc(e.id) + '"' + (openDays.has(e.id) ? ' open' : '') + '><summary><span class="sum-main"><span>' +
      prettyDate(e.date, false) + '</span>' + (e.timed && e.ts ? '<span class="sum-time">' + prettyTime(e.ts) + '</span>' : '') +
      '</span><span class="sum-right"><button class="del' + (pending === e.id ? ' pending' : '') + '" data-act="delete" data-id="' + esc(e.id) + '" aria-label="Delete this entry">' + (pending === e.id ? 'Delete?' : trashSvg) + '</button><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></summary>' + items + '</details></div>';
  }).join('');
  document.getElementById('app').innerHTML =
    '<div class="top-row"><button class="back" data-act="back">‹ Back to today</button>' +
      (log.length ? '<button class="del-all' + (pending === 'all' ? ' pending' : '') + '" data-act="deleteall">' + (pending === 'all' ? 'Tap again to delete all' : 'Delete all') + '</button>' : '') +
    '</div><h1>Logbook</h1>' +
    '<div class="log-scroll" id="logScroll" tabindex="0" aria-label="Days in the logbook">' +
    (days || '<p class="empty">No words yet. Open today’s words to start your logbook.</p>') + '</div>';
  document.getElementById('barInner').innerHTML = '';
}

function rerenderLogbook(){
  if (location.hash !== '#logbook') return;
  const sc = document.getElementById('logScroll'), top = sc ? sc.scrollTop : 0;
  renderLogbook();
  const sc2 = document.getElementById('logScroll'); if (sc2) sc2.scrollTop = top;
}

function levelHintText(ctx){
  if (ctx === 'mitam') return 'Level is not used for Mitam.';
  if (ctx === 'lit') return 'Literature has B1 and B2 words. A1 and A2 use the closest match, and Mix uses both.';
  return 'A1 is the easiest and B2 the hardest. Mix draws from all four levels.';
}
function choice(name, val, label, cur){
  return '<label class="choice"><input type="radio" name="' + name + '" value="' + val + '"' + (cur === val ? ' checked' : '') + '><span>' + label + '</span></label>';
}
function resetInfo(){
  const r = store.get('dw_reset');
  if (!r) return '';
  return '<p class="hint">Started over on ' + prettyDate(dateKey(new Date(r)), false) + '. The Logbook is kept.</p>';
}
function renderSettings(){
  const s = getSettings();
  document.getElementById('app').innerHTML =
    '<button class="back" data-act="back">‹ Back to today</button><h1>Settings</h1>' +
    '<section class="set-card"><h2>New words</h2><fieldset><legend>How often do new words appear?</legend>' +
      '<div class="choices">' + choice('freq','day','Once a day',s.freq) + choice('freq','run','Every time the app opens',s.freq) + '</div>' +
      '<p class="hint">With “Every time the app opens”, the Logbook shows the time next to the date.</p></fieldset>' +
      '<fieldset><legend>Word repeats</legend><div class="choices">' +
        choice('repeat','new','Only new words',s.repeat) + choice('repeat','allow','Allow repeats',s.repeat) + '</div>' +
        '<p class="hint">“Only new words” skips words already in the Logbook until all words are used, then starts over.</p>' +
        '<button class="reset-btn' + (pending === 'resetwords' ? ' pending' : '') + '" id="resetWords" data-act="resetwords"' + (s.repeat === 'allow' ? ' disabled' : '') + '>' +
          (pending === 'resetwords' ? 'Tap again to start over' : 'Start words over') + '</button>' +
        resetInfo() + '</fieldset></section>' +
    '<section class="set-card"><h2>Vocabulary</h2>' +
      '<fieldset><legend>Parts of speech</legend><div class="choices">' +
        choice('pos','n','Nouns',s.pos) + choice('pos','v','Verbs',s.pos) + choice('pos','adj','Adjectives',s.pos) + choice('pos','mix','Mix',s.pos) + '</div></fieldset>' +
      '<fieldset id="levelSet"' + (s.ctx === 'mitam' ? ' disabled' : '') + '><legend>Level</legend><div class="choices">' +
        choice('level','A1','A1',s.level) + choice('level','A2','A2',s.level) + choice('level','B1','B1',s.level) + choice('level','B2','B2',s.level) + choice('level','mix','Mix',s.level) + '</div>' +
        '<p class="hint" id="levelHint">' + levelHintText(s.ctx) + '</p></fieldset>' +
      '<fieldset><legend>Context</legend><div class="choices">' +
        choice('ctx','day','Day-to-day',s.ctx) + choice('ctx','lit','Literature',s.ctx) + choice('ctx','mitam','Mitam exam preparation',s.ctx) + '</div>' +
        '<p class="hint" id="mitamNote"' + (s.ctx === 'mitam' ? '' : ' hidden') + '>Mitam words come from the seven practice exams, and words that appear in more exams come first.</p></fieldset></section>' +
    '<p class="notice">Changes apply the next time words are generated. Words already shown stay the same.</p>' +
    '<p class="notice">Version ' + APP_VERSION + '</p>';
  document.getElementById('barInner').innerHTML = '';
}

/* ---------- Test: pick the Hebrew translation of a word from the Logbook ---------- */
let quiz = null;
const testSeen = new Set();
function loggedIndices(){ return [...new Set(loadLog().flatMap(e => e.words.map(p => p.i)))]; }
function heKey(x){ return x.he.split(/[,;(]/)[0].trim(); }
function shuffle(a){ for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function newQuestion(){
  const pool = loggedIndices();
  if (!pool.length) { quiz = null; return; }
  let fresh = pool.filter(i => !testSeen.has(i));
  if (!fresh.length) { testSeen.clear(); fresh = pool.filter(i => !quiz || i !== quiz.i || pool.length === 1); }
  const i = fresh[Math.floor(Math.random() * fresh.length)];
  testSeen.add(i);
  const x = WORDS[i];
  const others = shuffle(WORDS.map((w, k) => k).filter(k => k !== i && heKey(WORDS[k]) !== heKey(x)));
  others.sort((a, b) => ((WORDS[b].p === x.p) + (WORDS[b].c === x.c)) - ((WORDS[a].p === x.p) + (WORDS[a].c === x.c)));
  const opts = [{he:x.he, ok:true}], keys = new Set([heKey(x)]);
  for (const k of others) {
    if (opts.length >= 4) break;
    const key = heKey(WORDS[k]);
    if (keys.has(key)) continue;
    keys.add(key); opts.push({he:WORDS[k].he, ok:false});
  }
  quiz = {i, opts:shuffle(opts), tried:[], solved:false, showSent:false, msg:''};
}
function hiSentence(x){
  const t = x.s, lo = t.toLowerCase(), w = x.w.toLowerCase();
  for (const stem of [w, w.slice(0, -1)]) {
    let at = lo.indexOf(stem);
    while (at !== -1) {
      const before = at === 0 ? ' ' : lo[at - 1];
      if (!/[a-z]/.test(before)) {
        let end = at + stem.length;
        while (end < t.length && /[A-Za-z]/.test(t[end])) end++;
        return esc(t.slice(0, at)) + '<mark>' + esc(t.slice(at, end)) + '</mark>' + esc(t.slice(end));
      }
      at = lo.indexOf(stem, at + 1);
    }
  }
  return esc(t);
}
function renderTest(){
  if (!quiz) newQuestion();
  const head = '<button class="back" data-act="back">‹ Back to today</button><h1>Test</h1>';
  if (!quiz) {
    document.getElementById('app').innerHTML = head + '<p class="empty">The Logbook is empty. Open today’s words first, then come back to the test.</p>';
    document.getElementById('barInner').innerHTML = '';
    return;
  }
  const x = WORDS[quiz.i];
  const opts = quiz.opts.map((o, k) => {
    const wrong = quiz.tried.includes(k), right = quiz.solved && o.ok;
    return '<button class="opt' + (right ? ' ok' : wrong ? ' bad' : '') + '" data-act="answer" data-k="' + k + '"' + ((quiz.solved || wrong) ? ' disabled' : '') + ' lang="he" dir="rtl">' +
      '<span>' + esc(o.he) + '</span><span class="mark" aria-hidden="true">' + (right ? '✓' : wrong ? '✕' : '') + '</span></button>';
  }).join('');
  const sentence = quiz.showSent
    ? '<div class="bubble"><div class="s-row"><p>' + hiSentence(x) + '</p><button class="round small" data-act="audio" data-text="' + esc(x.s) + '" aria-label="Hear the sentence">' + speakerSvg + '</button></div></div>'
    : '';
  document.getElementById('app').innerHTML = head + '<p class="date">Choose the Hebrew translation</p>' +
    '<section class="card test">' + wordHead(x, 'accent') +
    '<div class="opts">' + opts + '</div>' +
    '<p class="verdict" role="status">' + esc(quiz.msg) + '</p>' +
    '<button class="ex-btn" data-act="showsent" aria-expanded="' + quiz.showSent + '">' + (quiz.showSent ? 'Hide sentence' : 'Show in sentence') + '</button>' +
    sentence + '</section>';
  document.getElementById('barInner').innerHTML = '<button class="primary" data-act="nextq">Next word</button>';
}

function route(){
  const h = location.hash;
  if (h === '#logbook') renderLogbook();
  else if (h === '#settings') renderSettings();
  else if (h === '#test') renderTest();
  else renderToday();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ---------- Long words: shrink the font so a word stays on one line ---------- */
function fitWords(){
  document.querySelectorAll('#app .word').forEach(el => {
    el.classList.remove('wrap'); el.style.fontSize = '';
    const avail = el.clientWidth;
    if (!avail || el.scrollWidth <= avail) return;            // hidden, or already fits
    const base = parseFloat(getComputedStyle(el).fontSize);
    const min = Math.max(14, Math.round(base * 0.5));
    let size = Math.max(min, Math.floor(base * avail / el.scrollWidth));
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > avail && size > min) { size--; el.style.fontSize = size + 'px'; }
    if (el.scrollWidth > avail && el.textContent.indexOf(' ') !== -1) el.classList.add('wrap');   // two-word terms may wrap at the space only
  });
}
new MutationObserver(() => requestAnimationFrame(fitWords)).observe(document.getElementById('app'), {childList: true});
window.addEventListener('resize', () => requestAnimationFrame(fitWords));

/* ---------- Actions ---------- */
document.addEventListener('toggle', ev => {
  const d = ev.target;
  if (d.matches && d.matches('details.day-card')) { d.open ? openDays.add(d.dataset.id) : openDays.delete(d.dataset.id); if (d.open) requestAnimationFrame(fitWords); }
}, true);

document.addEventListener('change', ev => {
  const t = ev.target;
  if (!t.matches || !t.matches('input[type="radio"]')) return;
  const s = getSettings(); s[t.name] = t.value; saveSettings(s);
  const note = document.getElementById('mitamNote');
  if (note) note.hidden = s.ctx !== 'mitam';
  const ls = document.getElementById('levelSet'), lh = document.getElementById('levelHint');
  if (ls) ls.disabled = s.ctx === 'mitam';
  if (lh) lh.textContent = levelHintText(s.ctx);
  const rb = document.getElementById('resetWords');
  if (rb) rb.disabled = s.repeat === 'allow';
});

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'delete') ev.preventDefault();      // the delete button sits in the row title: do not open or close the row
  if (act === 'audio') speak(b.dataset.text, b);
  else if (act === 'example') {
    const log = loadLog(), e = log.find(x => x.id === currentId);
    e.words[+b.dataset.idx].ex = true; saveLog(log);
    const y = window.scrollY; renderToday(); window.scrollTo(0, y);
    const bub = document.getElementById('b' + b.dataset.idx); if (bub) bub.classList.add('pop');
  }
  else if (act === 'logexample') {
    const log = loadLog(), e = log.find(x => x.id === b.dataset.id);
    e.words[+b.dataset.idx].ex = true; saveLog(log);
    const sc = document.getElementById('logScroll'), top = sc ? sc.scrollTop : 0;
    renderLogbook(); const sc2 = document.getElementById('logScroll'); if (sc2) sc2.scrollTop = top;
  }
  else if (act === 'translate') {
    const he = b.parentElement.querySelector('.he-sent'), show = he.hidden;
    he.hidden = !show; b.textContent = show ? 'Hide translation' : 'Translate'; b.setAttribute('aria-expanded', String(show));
  }
  else if (act === 'delete' || act === 'deleteall') {
    const key = act === 'deleteall' ? 'all' : b.dataset.id;
    if (pending !== key) {                       // first tap: ask for confirmation
      pending = key; rerenderLogbook();
      setTimeout(() => { if (pending === key) { pending = null; rerenderLogbook(); } }, 4000);
    } else {                                     // second tap: delete
      pending = null;
      const log = key === 'all' ? [] : loadLog().filter(x => x.id !== key);
      saveLog(log);
      if (key === 'all') openDays.clear(); else openDays.delete(key);
      rerenderLogbook();
    }
  }
  else if (act === 'test') { newQuestion(); location.hash = 'test'; route(); }
  else if (act === 'nextq') { newQuestion(); renderTest(); window.scrollTo(0, 0); }
  else if (act === 'answer') {
    const k = +b.dataset.k;
    if (!quiz || quiz.solved || quiz.tried.includes(k)) return;
    if (quiz.opts[k].ok) { quiz.solved = true; quiz.msg = 'Correct!'; }
    else { quiz.tried.push(k); quiz.msg = 'Not this one. Try another.'; }
    renderTest();
  }
  else if (act === 'showsent') { quiz.showSent = !quiz.showSent; renderTest(); }
  else if (act === 'resetwords') {
    if (getSettings().repeat === 'allow') return;
    if (pending !== 'resetwords') {
      pending = 'resetwords'; renderSettings();
      setTimeout(() => { if (pending === 'resetwords') { pending = null; if (location.hash === '#settings') renderSettings(); } }, 4000);
    } else {
      pending = null;
      store.set('dw_reset', nowShifted().toISOString());
      renderSettings();
    }
  }
  else if (act === 'logbook') location.hash = 'logbook';
  else if (act === 'settings') location.hash = 'settings';
  else if (act === 'back') location.hash = 'today';
  else if (act === 'reopen') {
    try { sessionStorage.setItem('dw_reload', '1'); } catch (e) {}
    location.hash = '';
    location.reload();
  }
  else if (act === 'nextday') { store.set('dw_offset', String(getOffset() + 1)); startSession(); location.hash = 'today'; route(); }
  else if (act === 'reset') {
    if (confirm('Erase all words and history?')) { store.del('dw_log'); store.del('dw_offset'); store.del('dw_reset'); startSession(); location.hash = 'today'; route(); }
  }
});

const createdNow = startSession();
let reloaded = false;
try { reloaded = sessionStorage.getItem('dw_reload') === '1'; sessionStorage.removeItem('dw_reload'); } catch (e) {}
if (reloaded) {
  flash = createdNow ? 'App reloaded: new words.' : 'App reloaded: same words as before.';
  setTimeout(() => { flash = ''; const t = document.getElementById('toast'); if (t) t.remove(); }, 3000);
}
route();
</script>

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function(){}); }
}
</script>
